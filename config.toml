# Site configuration. This file is about the website; facts about a mod live in
# content/<project>/mod.toml. Zola reads this file; so does CI.

# Where the site lives. On GitHub Pages the workflow substitutes the real Pages URL, so this
# value matters for local previews and for links inside the offline documentation that ships
# in archives.
base_url = "https://DreamWeave-MP.github.io/S3ctors-S3cret-St4sh"

# Title used by your web browser for the whole tab.
title = "S3ctor's S3cret St4sh"

# Do you want your site to break horribly?
# If so, set this to false.
ignored_content = ["**/AGENTS.md", "cod3x/examples/**", "**/cod3x/.opencode/**", "**/.swbuild/**", "content/h3lp_yours3lf/tools/source/*.webp", "content/h3lp_yours3lf/tools/source/*.jpg", "content/h3lp_yours3lf/tools/source/*.png", "**/tools/*", "**/*.dds", "**/*.nif"]
compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["rss.xml", "atom.xml"]
taxonomies = [{ name = "tags" }]

[search]
index_format = "fuse_json"
include_title = true
include_description = true
include_content = true
truncate_content_length = 400

[markdown]
highlighting = { theme = "dracula-soft" }

[slugify]
paths = "safe"

[link_checker]
skip_prefixes = ["https://github.com/", "https://www.nexusmods.com/"]

[extra]
# The GitHub repository that builds and publishes this site. Release downloads are served from
# its GitHub Releases, and CI refuses to build if these do not name the repository it runs in.
github_username = "DreamWeave-MP"
github_project = "S3ctors-S3cret-St4sh"

# Logo text displayed in the header.
logo_text = "S3ctor's S3cret St4sh"

# Palette: purple (DreamWeave), teal, gold, ember, moss, umber, grove, prism, slate, crimson,
# indigo, azure or frost. Anything bigger belongs in sass/brand.sass.
palette = "purple"

favicon = "img/s3_favicon.png"

# Page-view counts from https://www.goatcounter.com. This is DreamWeave-MP's own repository, so it
# reports to DreamWeave-MP's own GoatCounter site.
goatcounter = "dreamweave-mp"

# This is the default credit string displayed on every page which uses the `credits` shortcode.
# It's displayed alongside whatever the shortcode's body is, so this is a generic banner to reuse everywhere.
default_credits = """
All code in this repository was generated by Dave Corley under the GPL3 License.
Please enjoy my content, hack away as you please, and respect the freedoms of your fellow creators in the meantime.
"""

# Comments: GitHub Discussions on this site's own repository (github_username/github_project),
# embedded with giscus. The build looks up the ids for this repository; there are none to paste.
[extra.comments]
enabled = true
category = "General"
