  Intervall: 1.0 - 100.0

Horiz0nMinViewDistName: Minimalt visningsavstånd
Horiz0nMinViewDistDesc: |
  Anger den nedre gränsen för Horiz0ns automatiska hantering av visningsavståndet.
  Standard: 0.25
  Intervall: 0.01 - 1.0

