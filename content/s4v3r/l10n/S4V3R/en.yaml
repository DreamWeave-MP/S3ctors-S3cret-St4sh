CellChangeSaveToggleName: Save On Cell Change
CellChangeSaveToggleDesc: |
  Whether or not to save after moving into or out of an interior. Cell change saves overwrite a single file and don't count toward Max Saves.

  Requires H3lp Yours3lf.

  Default: No

CombatSaveCooldownName: Combat Save Cooldown
CombatSaveCooldownDesc: |
  Minimum time between combat saves in minutes. Set to 0 to disable.

  Default: 1
  Min: 0
  Max: 60

CombatSaveToggleName: Enable Combat Saves
CombatSaveToggleDesc: |
  Whether or not to save when combat starts or stops.

  Default: Yes

DebugEnableName: Enable Logging
DebugEnableDesc: |
  Print debug messages to the console (openmw.log or F10).

  Default: No

DeleteSavesName: Ironman Mode
DeleteSavesDesc: |
  Delete all saves S4V3R has made for this player upon dying.

  Default: No

IntervalSaveToggleName: Enable Interval Saves
IntervalSaveToggleDesc: |
  Whether or not to save every Save Interval minutes.

  Default: Yes

MaxSaveSlotsName: Max Saves
MaxSaveSlotsDesc: |
  Maximum number of saves to keep. When this number is reached, the oldest existing save is overwritten.

  Default: 10
  Min: 1
  Max: 100

RestSaveToggleName: Save When Resting
RestSaveToggleDesc: |
  Whether or not to save when the rest or wait menu opens. Rest saves overwrite a single file and don't count toward Max Saves.

  If you enable this, consider disabling OpenMW's own autosave on rest.

  Default: No

S4V3RActiveDesc: Whether or not to make any autosaves, ever.
S4V3RActiveName: Disable/Enable
S4V3RDesc: Automatically saves the game at regular intervals and optionally when combat starts or stops.
S4V3RName: S4V3R
S4V3ROptions: Options
S4V3RToggleOn: Enable
S4V3RToggleOff: Disable

SaveIntervalName: Save Interval
SaveIntervalDesc: |
  Time interval between saves in minutes.

  Default: 9
  Min: 1
  max: 60

SavePrefixName: Save Name Prefix
SavePrefixDesc: Prefix used in save names. Empty by default.

StartSaveToggleName: Enable Start Saves
StartSaveToggleDesc: |
  Whether or not to save the game when character creation finishes.

  Default: Yes
