CellChangeSaveToggleName: Sauvegarder au changement de cellule
CellChangeSaveToggleDesc: |
  Détermine s'il faut sauvegarder ou non après être entré dans un intérieur ou en être sorti. Les sauvegardes de changement de cellule remplacent un seul fichier et ne comptent pas dans le nombre maximal de sauvegardes.

  Nécessite H3lp Yours3lf.

  Par défaut : Non

CombatSaveCooldownName: Délai entre les sauvegardes de combat
CombatSaveCooldownDesc: |
  Temps minimum entre les sauvegardes de combat, en minutes. Mettre à 0 pour désactiver.

  Par défaut : 1
  Min : 0
  Max : 60

CombatSaveToggleName: Activer les sauvegardes de combat
CombatSaveToggleDesc: |
  Détermine s'il faut sauvegarder ou non lorsque le combat commence ou se termine.

  Par défaut : Oui

DebugEnableName: Activer les journaux
DebugEnableDesc: |
  Affiche les messages de débogage dans la console (openmw.log ou F10).

  Par défaut : Non

DeleteSavesName: Mode Ironman
DeleteSavesDesc: |
  Supprimer toutes les sauvegardes créées par S4V3R pour ce joueur à sa mort.

  Par défaut : Non

IntervalSaveToggleName: Activer les sauvegardes périodiques
IntervalSaveToggleDesc: |
  Détermine s'il faut sauvegarder ou non à chaque intervalle de sauvegarde.

  Par défaut : Oui

MaxSaveSlotsName: Nombre maximal de sauvegardes
MaxSaveSlotsDesc: |
  Nombre maximal de sauvegardes à conserver. Lorsque cette limite est atteinte, la sauvegarde la plus ancienne est remplacée.

  Par défaut : 10
  Min : 1
  Max : 100

RestSaveToggleName: Sauvegarder au repos
RestSaveToggleDesc: |
  Détermine s'il faut sauvegarder ou non après s'être reposé ou avoir attendu au moins une heure. Les sauvegardes de repos remplacent un seul fichier et ne comptent pas dans le nombre maximal de sauvegardes.

  Si vous activez cette option, pensez à désactiver la sauvegarde automatique au repos d'OpenMW.

  Par défaut : Non

S4V3RActiveDesc: "Indique s'il faut effectuer des sauvegardes automatiques ou non."
S4V3RActiveName: Désactiver/Activer
S4V3RDesc: Sauvegarde automatiquement le jeu à intervalles réguliers et, en option, lorsque le combat commence ou se termine.
S4V3RName: S4V3R
S4V3ROptions: Paramètres
S4V3RToggleOn: Activer
S4V3RToggleOff: Désactiver

SaveIntervalName: Intervalle de sauvegarde
SaveIntervalDesc: |
  Intervalle de temps entre les sauvegardes, en minutes.

  Par défaut : 9
  Min : 1
  Max : 60

SavePrefixName: Préfixe du nom de sauvegarde
SavePrefixDesc: Préfixe utilisé dans les noms de sauvegarde. Vide par défaut.

StartSaveToggleName: Activer les sauvegardes de début
StartSaveToggleDesc: |
  Détermine s'il faut sauvegarder ou non lorsque la création du personnage est terminée.

  Par défaut : Oui
