CombatSaveToggleName: Aktivera stridssparningar
CombatSaveToggleDesc: |
  Anger om spelet ska sparas när strid börjar eller slutar.

  Standard: Ja

DebugEnableName: Aktivera loggning
DebugEnableDesc: |
  Skriver ut felsökningsmeddelanden till konsolen (openmw.log eller F10).

  Standard: Nej

DeleteSavesName: Ironman-läge
DeleteSavesDesc: |
  Ta bort alla sparfiler som S4V3R har skapat för den här spelaren när spelaren dör.

  Standard: Nej

MaxSaveSlotsName: Maximalt antal sparningar
MaxSaveSlotsDesc: |
  Maximalt antal sparningar som ska behållas. När detta antal har nåtts skrivs den äldsta sparningen över.

  Standard: 10
  Min: 1
  Max: 100

S4V3RActiveDesc: Huruvida autosparningar ska göras eller inte.
S4V3RActiveName: Inaktivera/Aktivera
S4V3RDesc: Sparar automatiskt spelet med regelbundna intervall och, om aktiverat, när strid börjar eller slutar.
S4V3RName: S4V3R
S4V3ROptions: Alternativ
S4V3RToggleOn: Aktivera
S4V3RToggleOff: Inaktivera

SaveIntervalName: Sparintervall
SaveIntervalDesc: |
  Tidsintervall mellan sparningar i minuter.

  Standard: 9
  Min: 1
  Max: 60

StartSaveToggleName: Aktivera startsparningar
StartSaveToggleDesc: |
  Anger om spelet ska sparas när karaktärsskapandet är klart.

  Standard: Ja
