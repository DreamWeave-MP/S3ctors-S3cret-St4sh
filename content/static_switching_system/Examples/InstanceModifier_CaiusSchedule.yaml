      - record_id: caius cosades
      - cell_match: "Balmora, Caius Cosades' House"
      - time_of_day:
          min: 8
          max: 13
    actions:
      - teleport:
          cell:
            x: -2
            y: -2
          position:
            x: -15371
            y: -12604
            z: 759
