TransmogPageName: Transmog Menu
TransmogPageDesc: Create enchanted items with one item's appearance and another item's properties.

TransmogSettingsName: Key Bindings
TransmogSettingsDesc: Configure the controls used by the Transmog menu.

TransmogOpenActionName: Open Transmog Menu
TransmogOpenActionDesc: Opens the Transmog menu.

TransmogConfirmActionName: Confirm Transmog
TransmogConfirmActionDesc: Creates the selected Transmog item.

TransmogPreviewActionName: Preview Transmog
TransmogPreviewActionDesc: Temporarily previews the selected appearance.

