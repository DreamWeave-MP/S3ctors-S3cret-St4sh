TransmogRotateLeftActionDesc: Rotates the character left while the Transmog menu is open.

TransmogRotateRightActionName: Rotate Right
TransmogRotateRightActionDesc: Rotates the character right while the Transmog menu is open.

TransmogOpenBindingName: Open Transmog Menu
TransmogOpenBindingDesc: Key binding used to open the Transmog menu.

TransmogConfirmBindingName: Confirm Transmog
TransmogConfirmBindingDesc: Key binding used to create the selected Transmog item.

TransmogPreviewBindingName: Preview Transmog
TransmogPreviewBindingDesc: Key binding used to preview the selected appearance.

