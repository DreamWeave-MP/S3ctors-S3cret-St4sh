SoulGemVariantName: Seelenstein-Stil
SoulGemVariantDesc: |-
  Dein bevorzugter Seelenstein-Stil wird verwendet, wann immer VSG einen gefüllten Seelenstein umwandelt.
  Eine Änderung des Stils wirkt sich nicht auf bereits umgewandelte Seelensteine aus,
  sodass du während deines Spieldurchlaufs verschiedene Stile mischen kannst, wenn du möchtest.
SoulGemRandomizeName: Zufälliger Seelenstein-Stil
SoulGemRandomizeDesc: Wählt jedes Mal einen zufälligen visuellen Stil, wenn VSG einen gefüllten Seelenstein umwandelt.

VisualSoulGemsDesc: Verleiht gefüllten Seelensteinen mit vier auswählbaren oder zufälligen Stilen unterschiedliche visuelle Effekte.
