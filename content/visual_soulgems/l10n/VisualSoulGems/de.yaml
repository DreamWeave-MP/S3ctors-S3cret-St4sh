SoulGemRandomizeName: Zufälliger Seelenstein-Stil
SoulGemRandomizeDesc: Wählt jedes Mal einen zufälligen aktivierten visuellen Stil, wenn VSG einen gefüllten Seelenstein umwandelt.

VisualSoulGemsDesc: Verleiht gefüllten Seelensteinen mit vier auswählbaren oder zufälligen Stilen unterschiedliche visuelle Effekte.
VisualSoulGemsName: Visual Soul Gems OpenMW

VisualSoulGemsGroupName: Seelenstein-Stile
VisualSoulGemsGroupDesc: Wähle, welche visuellen Stile aktiviert sind. Wenn die Zufallsauswahl aktiviert ist, bilden diese Stile die Auswahl. Wenn sie deaktiviert ist, aktiviere einen Stil, der bei jeder Umwandlung verwendet werden soll.
