SoulGemVariantName: Soul Gem Style
SoulGemVariantDesc: |-
  Your preferred soul gem style is used whenever one is activated.
  Changing the style works in-game, however does not take effect for already-converted soul gems,
  allowing you to mix and match throughout your playthrough if you like.

