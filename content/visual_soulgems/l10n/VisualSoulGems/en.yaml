SoulGemVariantName: Soul Gem Style
SoulGemVariantDesc: |-
  Your preferred soul gem style is used whenever VSG converts a filled soul gem.
  Changing the style does not affect already-converted soul gems,
  allowing you to mix and match throughout your playthrough if you like.
SoulGemRandomizeName: Randomize Soul Gem Style
SoulGemRandomizeDesc: Choose a random visual style whenever VSG converts a filled soul gem.

