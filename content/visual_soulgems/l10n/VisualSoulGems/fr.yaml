SoulGemVariantName: Style des gemmes spirituelles
SoulGemVariantDesc: |-
  Votre style de gemme spirituelle préféré est utilisé chaque fois que VSG convertit une gemme spirituelle remplie.
  Changer de style n'affecte pas les gemmes spirituelles déjà converties,
  ce qui vous permet de mélanger les styles au fil de votre partie si vous le souhaitez.
SoulGemRandomizeName: Style de gemme spirituelle aléatoire
SoulGemRandomizeDesc: Choisit un style visuel aléatoire chaque fois que VSG convertit une gemme spirituelle remplie.

VisualSoulGemsDesc: Donne aux gemmes spirituelles remplies des effets visuels distincts grâce à quatre styles sélectionnables ou aléatoires.
