SoulGemVariantName: Stil för själsstenar
SoulGemVariantDesc: |-
  Din valda stil för själsstenar används varje gång VSG konverterar en fylld själssten.
  Att byta stil påverkar inte själsstenar som redan har konverterats,
  så du kan blanda olika stilar under genomspelningen om du vill.
