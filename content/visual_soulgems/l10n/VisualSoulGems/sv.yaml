SoulGemVariantName: Stil för själsstenar
SoulGemVariantDesc: |-
  Din valda stil för själsstenar används varje gång en sådan aktiveras.
  Du kan byta stil under spelets gång, men ändringen påverkar inte själsstenar som redan har konverterats,
  så du kan blanda olika stilar under genomspelningen om du vill.

VisualSoulGemsDesc: Byter dynamiskt ut tomma själsstensobjekt mot fyllda varianter med ersättningsresurser av SVNR.
